services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-infrawise}:${POSTGRES_PASSWORD:-infrawise_dev_only}@db:5432/${POSTGRES_DB:-infrawise}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrawise}
      POSTGRES_USER: ${POSTGRES_USER:-infrawise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infrawise_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
